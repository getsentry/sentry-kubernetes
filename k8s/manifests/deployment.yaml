apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: sentry-kubernetes
  name: sentry-kubernetes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentry-kubernetes
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: sentry-kubernetes
    spec:
      containers:
        - image: ghcr.io/getsentry/sentry-kubernetes:latest
          name: sentry-kubernetes
          env:
            - name: SENTRY_K8S_LOG_LEVEL
              value: debug
            - name: SENTRY_DSN
              # TODO: Set your Sentry DSN here
              value: ""
            - name: SENTRY_K8S_INTEGRATION_GKE_ENABLED
              value: "1"
      serviceAccount: sentry-k8s-agent
